[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creditalo"
version = "1.0.0"
description = "Explainable credit scoring for microfinance institutions (PD model, SHAP reason codes, FastAPI, Streamlit)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
