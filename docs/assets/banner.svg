<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="CreditAlo MFI banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1a">
        <animate attributeName="stop-color" values="#070b1a;#0a1a33;#10143a;#070b1a" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#0f2a4a">
        <animate attributeName="stop-color" values="#0f2a4a;#143a5c;#1b2a5e;#0f2a4a" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22e6c3"/>
      <stop offset="0.6" stop-color="#6aa8ff"/>
      <stop offset="1" stop-color="#ffc857"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22e6c3" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22e6c3"/>
      <stop offset="1" stop-color="#ffc857"/>
    </linearGradient>
    <linearGradient id="gauge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22e6c3"/>
      <stop offset="1" stop-color="#ffc857"/>
    </linearGradient>
    <radialGradient id="coin" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fff2b8"/>
      <stop offset="1" stop-color="#f0a500"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#3b6fb6" stroke-opacity="0.18" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round"><rect width="1200" height="300" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>

    <!-- scanning bar (robotic feel) -->
    <rect y="0" width="90" height="300" fill="#22e6c3" opacity="0.07">
      <animate attributeName="x" values="-120;1200" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- market line chart -->
    <path id="chart" d="M20,250 L120,225 L210,238 L310,196 L400,210 L500,160 L590,178 L690,120 L780,140 L880,92 L980,108 L1180,60"
          fill="none" stroke="url(#line)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"
          stroke-dasharray="1500" stroke-dashoffset="1500" filter="url(#glow)" opacity="0.9">
      <animate attributeName="stroke-dashoffset" values="1500;0;0;1500" keyTimes="0;0.55;0.9;1" dur="8s" repeatCount="indefinite"/>
    </path>
    <circle r="6" fill="#ffc857" filter="url(#glow)">
      <animateMotion dur="8s" repeatCount="indefinite" keyPoints="0;1;1;0" keyTimes="0;0.55;0.9;1" calcMode="linear">
        <mpath href="#chart"/>
      </animateMotion>
    </circle>

    <!-- candlestick bars -->
    <g opacity="0.35">
      <rect x="150" y="238" width="10" height="40" fill="#22e6c3"><animate attributeName="height" values="40;62;40" dur="3s" repeatCount="indefinite"/></rect>
      <rect x="260" y="226" width="10" height="52" fill="#ff6b81"><animate attributeName="height" values="52;30;52" dur="2.6s" repeatCount="indefinite"/></rect>
      <rect x="370" y="214" width="10" height="64" fill="#22e6c3"><animate attributeName="height" values="64;80;64" dur="3.4s" repeatCount="indefinite"/></rect>
      <rect x="470" y="232" width="10" height="46" fill="#ff6b81"><animate attributeName="height" values="46;66;46" dur="2.9s" repeatCount="indefinite"/></rect>
      <rect x="570" y="208" width="10" height="70" fill="#22e6c3"><animate attributeName="height" values="70;54;70" dur="3.2s" repeatCount="indefinite"/></rect>
      <rect x="670" y="222" width="10" height="56" fill="#22e6c3"><animate attributeName="height" values="56;74;56" dur="2.7s" repeatCount="indefinite"/></rect>
    </g>

    <!-- floating coins -->
    <g>
      <g>
        <circle cx="720" cy="70" r="20" fill="url(#coin)"/><circle cx="720" cy="70" r="12" fill="none" stroke="#b97a00" stroke-width="2"/>
        <animateTransform attributeName="transform" type="translate" values="0,0;0,-14;0,0" dur="3.5s" repeatCount="indefinite"/>
      </g>
      <g>
        <circle cx="810" cy="215" r="14" fill="url(#coin)"/><circle cx="810" cy="215" r="8" fill="none" stroke="#b97a00" stroke-width="1.6"/>
        <animateTransform attributeName="transform" type="translate" values="0,0;0,12;0,0" dur="4.2s" repeatCount="indefinite"/>
      </g>
      <g>
        <circle cx="640" cy="250" r="10" fill="url(#coin)"/>
        <animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="3s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- title block -->
    <text x="50" y="120" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="74" font-weight="800" letter-spacing="2" fill="url(#title)" filter="url(#glow)">CreditAlo</text>
    <text x="54" y="156" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="22" fill="#cfe3ff">Explainable Credit Scoring for Microfinance</text>
    <text x="54" y="182" font-family="'Courier New', monospace" font-size="15" fill="#7fa6d6" letter-spacing="2">
      aka TrustLens MFI
      <animate attributeName="opacity" values="1;0.45;1" dur="2.5s" repeatCount="indefinite"/>
    </text>

    <!-- pipeline chips -->
    <g font-family="'Courier New', monospace" font-size="15" font-weight="700" text-anchor="middle">
      <g><rect x="54" y="205" width="62" height="32" rx="16" fill="#22e6c3" fill-opacity="0.15" stroke="#22e6c3"/><text x="85" y="226" fill="#22e6c3">PD</text></g>
      <text x="132" y="227" fill="#7fa6d6" font-size="18">&#8594;</text>
      <g><rect x="150" y="205" width="118" height="32" rx="16" fill="#6aa8ff" fill-opacity="0.15" stroke="#6aa8ff"/><text x="209" y="226" fill="#6aa8ff">0-100 SCORE</text></g>
      <text x="284" y="227" fill="#7fa6d6" font-size="18">&#8594;</text>
      <g><rect x="302" y="205" width="116" height="32" rx="16" fill="#ffc857" fill-opacity="0.15" stroke="#ffc857"/><text x="360" y="226" fill="#ffc857">SHAP CODES</text></g>
      <animate attributeName="opacity" values="0.85;1;0.85" dur="4s" repeatCount="indefinite"/>
    </g>

    <!-- score gauge -->
    <g transform="translate(1030,150)">
      <circle r="78" fill="#07101f" fill-opacity="0.65"/>
      <circle r="66" fill="none" stroke="#1d3558" stroke-width="12"/>
      <circle r="66" fill="none" stroke="url(#gauge)" stroke-width="12" stroke-linecap="round"
              stroke-dasharray="415" stroke-dashoffset="415" transform="rotate(-90)" filter="url(#glow)">
        <animate attributeName="stroke-dashoffset" values="415;125;125;415" keyTimes="0;0.4;0.85;1" dur="6s" repeatCount="indefinite"/>
      </circle>
      <text y="6" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="42" font-weight="800" fill="#ffffff">70</text>
      <text y="32" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#7fa6d6" letter-spacing="3">SCORE</text>
      <text y="-30" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#22e6c3" letter-spacing="2">BAND B</text>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="298" rx="22" fill="none" stroke="#3b6fb6" stroke-opacity="0.5"/>
</svg>
